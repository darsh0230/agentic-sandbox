[package]
name = "pi-sandbox-master"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = "0.7"
bytes = "1.9"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.42", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.11", features = ["serde", "v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
libseccomp = "0.3"
nix = { version = "0.29", features = ["fs", "hostname", "mount", "process", "sched", "signal", "user"] }

[dev-dependencies]
tempfile = "3.14"
