name: agentic-sandbox

services:
  agentic-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-sandbox:dev
    container_name: agentic-sandbox
    networks:
      - agentic-sandbox-net
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SETPCAP
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - KILL
    security_opt:
      - seccomp=unconfined
    tmpfs:
      - /run:rw,nosuid,nodev,size=64m
      - /tmp:rw,nosuid,nodev,size=256m
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - agentic-sandbox-state:/var/lib/agentic-sandbox
    environment:
      RUST_LOG: info
      AGENTIC_SANDBOX_ROOT: /var/lib/agentic-sandbox
      AGENTIC_SANDBOX_HTTP_TOKEN: ${AGENTIC_SANDBOX_HTTP_TOKEN:-change-me-dev-token}
    command:
      - /usr/local/bin/agentic-sandbox
      - serve
      - --http
      - 0.0.0.0:8080

networks:
  agentic-sandbox-net:
    driver: bridge

volumes:
  agentic-sandbox-state:
