name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libseccomp-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run Rust test suite
        run: cargo test --locked --all-targets
      - name: Validate Compose configuration
        run: |
          docker compose --profile user config --quiet
          docker compose --profile privileged config --quiet
      - name: Validate example shell scripts
        run: find examples -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

  docker-e2e:
    name: Docker E2E
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libseccomp-dev
      - name: Run user and privileged isolation E2E tests
        run: cargo test --locked --test docker_e2e -- --ignored --test-threads=1
