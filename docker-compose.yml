services:
  pi-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: pi-sandbox:dev
    container_name: pi-sandbox
    networks:
      - pi-sandbox-net
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SETPCAP
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - KILL
    security_opt:
      - seccomp=unconfined
    tmpfs:
      - /run:rw,nosuid,nodev,size=64m
      - /tmp:rw,nosuid,nodev,size=256m
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - pi-sandbox-state:/var/lib/pi-sandbox
    environment:
      RUST_LOG: info
      PI_SANDBOX_ROOT: /var/lib/pi-sandbox
      PI_SANDBOX_HTTP_TOKEN: change-me-dev-token
    command:
      - /usr/local/bin/pi-sandbox-master
      - serve
      - --http
      - 0.0.0.0:8080

networks:
  pi-sandbox-net:
    driver: bridge

volumes:
  pi-sandbox-state:
